name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:      # run manually from the Actions tab
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Main card: activity, community stats, repo summary
      - name: Overview card
        uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN is a personal access token stored as a repo secret.
          # Falls back to GITHUB_TOKEN, which works but omits private activity.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Shivendra-99
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # Language breakdown card
      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Shivendra-99
          filename: metrics.languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
